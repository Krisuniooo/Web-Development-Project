; PHP settings for the app, the bot and the jobs in bin/. The image has no php.ini, so without this file
; PHP would print errors into the pages.

; errors go to the log (docker compose logs), never to the visitor
display_errors = Off
display_startup_errors = Off
log_errors = On

; no X-Powered-By header with the PHP version
expose_php = Off

; enough for the largest request and for the bot, which keeps its queue in memory
memory_limit = 256M

; a session unused for an hour ends: AppController checks it on every request, the garbage collector only now and then
session.gc_maxlifetime = 3600
