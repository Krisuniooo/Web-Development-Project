; PHP settings for the app, the bot and the jobs in bin/. The image has no php.ini, so without this file
; PHP would print errors into the pages; they go to docker compose logs instead.
display_errors = Off
display_startup_errors = Off
log_errors = On

; no X-Powered-By header with the PHP version
expose_php = Off

; enough for the largest request and for the bot, which keeps its queue in memory
memory_limit = 256M

; an idle session ends after an hour, checked by AppController on every request
session.gc_maxlifetime = 3600
