server {
    listen 80;
    server_name _;

    root /app/public;
    index index.php index.html;

    # no nginx version in the headers and error pages
    server_tokens off;

    # sent with every answer, errors included; no location below adds headers of its own, so all of them get these
    # the panel cannot be put in a frame on another site, where a hidden click could send its forms
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # only this site's scripts, styles and fonts; pictures also from Discord, for avatars and server icons;
    # style attributes are allowed for the few custom properties the views set, such as the width of a bar
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' https://cdn.discordapp.com https://static-cdn.jtvnw.net; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # index.php is the only script: any other .php URL, such as a view, gets the app's 404 page
    location ~* \.php$ {
        rewrite ^ /index.php last;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\. {
        deny all;
    }
}
