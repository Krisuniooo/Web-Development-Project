services:
  server:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/app
    depends_on:
      - php
    networks:
      - pg-network

  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - pg-network
    # the schema comes from the migrate service, not from Postgres's first start, so it works on an existing database too
    volumes:
      - pg-data:/var/lib/postgresql
    # ready once it takes connections, so migrate does not start too early
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30

  # brings the schema up to date with database/migrations, then stops; the app, the bot and cron wait for it
  migrate:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # the autoloader first, since a fresh clone has no vendor/ yet
    command: ["sh", "-c", "composer dump-autoload --quiet && php bin/migrate.php"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - pg-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
    networks:
      - pg-network

  discord-bot:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php bin/discord-bot.php
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # passes the stop signal on to PHP, so the container stops at once
    init: true
    # starts again after a crash, but not when the bot stops on purpose
    restart: on-failure
    volumes:
      - .:/app
    networks:
      - pg-network

  # runs bin/cleanup.php every day at 03:15 UTC
  cron:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # cron keeps no output of its jobs, so it is sent to the container's log: docker compose logs cron
    command: ["sh", "-c", "echo '15 3 * * * cd /app && php bin/cleanup.php > /proc/1/fd/1 2>&1' | crontab - && exec crond -f"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # passes the stop signal on to cron, so the container stops at once
    init: true
    restart: on-failure
    volumes:
      - .:/app
    networks:
      - pg-network

  # the moderation model for Polish and English; it has no port, so only the other containers reach it
  basal-mini:
    build:
      context: .
      dockerfile: docker/basal/Dockerfile
    environment:
      # the version measured in docs/models.md, so an update on Hugging Face does not change the results
      BASAL_REPO: Remek/basal-2.0-mini-GGUF
      BASAL_REVISION: 162d336b27b29939ea0978c925492752f8d1b7c7
      BASAL_FILE: basal-2.0-mini-Q8_0.gguf
    restart: on-failure
    volumes:
      - basal-models:/root/.cache/huggingface
    networks:
      - pg-network

  # the smaller and faster moderation model, for English only; no port either
  basal-pico:
    build:
      context: .
      dockerfile: docker/basal/Dockerfile
    environment:
      # pinned like mini, so an update on Hugging Face does not change the results
      BASAL_REPO: Remek/basal-omni-pico-GGUF
      BASAL_REVISION: c125629c09ca8fcaa62113e0f12ba5abc5e14896
      BASAL_FILE: basal-omni-pico-Q8_0.gguf
    restart: on-failure
    volumes:
      - basal-models:/root/.cache/huggingface
    networks:
      - pg-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks:
      - pg-network

  pgadmin-wdpai:
    image: dpage/pgadmin4:latest
    container_name: ${PGADMIN_CONTAINER_NAME:-pg-admin}
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - pg-network

networks:
  pg-network:

volumes:
  pg-data:
  # model files from Hugging Face, downloaded once
  basal-models: